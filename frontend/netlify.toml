[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — every non-asset path is handled by the React router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy the API through the same origin so the browser never makes a
# cross-origin request and no CORS preflight is needed in production.
# Set API_ORIGIN in the Netlify UI to your deployed backend.
[[redirects]]
  from = "/api/*"
  to = " https://sca-api-o5p5.onrender.com"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
