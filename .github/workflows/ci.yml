name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Backend lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: mypy
        # Type errors shouldn't block a PR while annotations are still being
        # tightened, but they must stay visible in the log.
        run: mypy app
        continue-on-error: true

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite itself runs on SQLite; these services back the migration check
    # below so schema changes are validated against real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sca
          POSTGRES_PASSWORD: sca
          POSTGRES_DB: sca_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key
          ANTHROPIC_API_KEY: ci-fake-key
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Verify migrations apply to a real Postgres database
        env:
          DATABASE_URL: postgresql+asyncpg://sca:sca@localhost:5432/sca_test
          SECRET_KEY: ci-secret-key
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` needs a committed lockfile; fall back to `npm install` so the
      # first push (before the lockfile exists) still runs green.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: supply-chain-analyzer-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm -d --name api-smoke -p 8000:8000 \
            -e SECRET_KEY=ci-secret-key \
            -e DATABASE_URL=postgresql+asyncpg://u:p@localhost:5432/none \
            supply-chain-analyzer-api:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/api/v1/health; then
              docker stop api-smoke && exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          docker logs api-smoke
          docker stop api-smoke
          exit 1
