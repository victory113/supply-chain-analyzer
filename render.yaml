# Render blueprint — free-tier deployment of the API.
#
# Deliberately does NOT provision Render's own Postgres or Redis:
#   * Render's free Postgres is deleted after 30 days, which is useless for a
#     portfolio link. Neon's free tier is persistent, so DATABASE_URL is set
#     manually to a Neon connection string instead.
#   * Render does not offer background workers on the free plan. Without a
#     Celery worker, the API detects the broker is unreachable and runs the
#     analysis as an in-process background task (app/workers/broker.py). The
#     API contract is identical either way, so the frontend cannot tell.
#
# To run the full production topology (worker + managed Postgres + Redis),
# move to paid plans and see the commented block at the bottom.

services:
  - type: web
    name: sca-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health

    # No dockerCommand on purpose. The image's entrypoint script already runs
    # migrations and binds $PORT. An inline `sh -c "a && b"` here fails with
    # exit 127, because Render runs this field through a shell already and the
    # nested quoting collapses into a single unfound program name.

    envVars:
      # Neon connection string. Pasted as-is from the Neon dashboard — the app
      # rewrites the driver and the sslmode parameter itself (core/config.py).
      - key: DATABASE_URL
        sync: false

      # Optional. Leave unset and the cache no-ops; the app is fully functional
      # without it. Set to an Upstash URL to enable caching.
      - key: REDIS_URL
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      # Generated once by Render and never shown to you. Rotating it logs
      # everyone out, which is the correct behaviour for a signing key.
      - key: SECRET_KEY
        generateValue: true

      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"

      # Only needed if the frontend calls this host cross-origin. With the
      # Netlify proxy in netlify.toml, requests are same-origin and this can
      # stay empty.
      - key: CORS_ORIGINS
        sync: false

