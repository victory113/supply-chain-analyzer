# Kept for continuity with the original deployment. `render.yaml` at the repo
# root is the primary target now — it provisions the worker, Postgres, and
# Redis as separate services, which this single-service config cannot.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
