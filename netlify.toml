# Netlify configuration.
#
# This file MUST live at the repository root. Netlify looks for netlify.toml
# in the site's base directory, and the base directory is only known once this
# file has been read — so a copy inside frontend/ is never found by a site
# whose base is unset, and the UI's build settings get used instead.
#
# Settings here take precedence over anything configured in the Netlify UI.

[build]
  # The Vite app lives in a subdirectory. `command` runs there, and `publish`
  # is resolved relative to base — so this publishes frontend/dist.
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ORDER MATTERS. Netlify evaluates redirects top to bottom and the first
# match wins, so the API proxy has to come before the SPA catch-all. With
# "/*" first it swallows /api/* too: GET returns index.html and POST 404s,
# which looks like a broken backend but is purely a routing-order bug.

# Proxy the API through this origin so the browser never makes a cross-origin
# request: no CORS preflight, and no allowed-origins list to maintain.
#
# `:splat` is the wildcard captured by `from = "/api/*"` and must be kept —
# without it every call lands on the backend's root instead of the endpoint,
# so /api/v1/auth/login would return the service banner rather than a token.
[[redirects]]
  from = "/api/*"
  to = "https://sca-api-o5p5.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — React Router owns every remaining path, so any request that
# isn't a real file returns index.html instead of a 404. Must stay last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite fingerprints asset filenames, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
